services:
  - type: web
    name: puertas-tibia-map-visualizer-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_ORIGIN
        value: https://puertas-tibia-map-visualizer.netlify.app
      - key: EXPORT_MAX_PIXELS
        value: "4000000"
      - key: EXPORT_COMPOSITE_BATCH_SIZE
        value: "4"
